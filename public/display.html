<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Display sala</title>
  <style>
    :root { --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: var(--font); color: #fff; background: #0b1220; -webkit-font-smoothing: antialiased; user-select: none; -webkit-tap-highlight-color: transparent; cursor: default; }
    .screen { position: fixed; inset: 0; display: grid; grid-template-columns: 1.45fr 1fr; transition: background .8s ease; }
    .screen::before { content: ""; position: absolute; inset: 0; background: radial-gradient(900px 700px at 0% 0%, rgba(255,255,255,.14), transparent 60%); pointer-events: none; }
    .s-libera { background: linear-gradient(140deg, #059669 0%, #047857 55%, #065f46 100%); }
    .s-occupata { background: linear-gradient(140deg, #dc2626 0%, #b91c1c 55%, #7f1d1d 100%); }
    .s-in_arrivo { background: linear-gradient(140deg, #f59e0b 0%, #d97706 55%, #92400e 100%); }
    .s-chiusa, .s-fuori_orario { background: linear-gradient(140deg, #334155 0%, #1e293b 60%, #0f172a 100%); }

    .main { position: relative; padding: 5vh 4.5vw; display: flex; flex-direction: column; min-width: 0; }
    .room-label { display: flex; align-items: center; gap: 14px; }
    .room-label .chip { font-size: 1.6vh; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; padding: .6vh 1.2vh; border-radius: 99px; background: rgba(255,255,255,.18); }
    .room-name { font-size: 6.4vh; font-weight: 800; letter-spacing: -.02em; margin: 1.4vh 0 .6vh; line-height: 1.05; }
    .room-meta { font-size: 2.1vh; opacity: .8; display: flex; gap: 2.4vh; flex-wrap: wrap; }
    .status { margin-top: auto; }
    .status-word { font-size: 15vh; font-weight: 900; letter-spacing: -.04em; line-height: .9; text-transform: uppercase; }
    .status-sub { font-size: 3.4vh; font-weight: 600; opacity: .92; margin-top: 1.6vh; }
    .meeting { margin-top: 4vh; background: rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.18); border-radius: 2.4vh; padding: 2.6vh 3vh; backdrop-filter: blur(8px); max-width: 900px; }
    .meeting .m-label { font-size: 1.6vh; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
    .meeting .m-title { font-size: 3.6vh; font-weight: 750; margin-top: .8vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meeting .m-sub { font-size: 2.2vh; opacity: .85; margin-top: .5vh; }
    .progress { height: .9vh; border-radius: 99px; background: rgba(255,255,255,.22); margin-top: 2vh; overflow: hidden; }
    .progress div { height: 100%; background: #fff; border-radius: 99px; transition: width 1s linear; }
    .actions { display: flex; gap: 1.6vh; margin-top: 3vh; flex-wrap: wrap; }
    .act { font: inherit; font-size: 2.3vh; font-weight: 700; color: inherit; border: 2px solid rgba(255,255,255,.7); background: rgba(255,255,255,.12); padding: 1.8vh 3.4vh; border-radius: 1.8vh; cursor: pointer; transition: .15s; }
    .act:active { transform: scale(.97); }
    .act.primary { background: #fff; color: #0f172a; border-color: #fff; }
    .act.confirm { background: #fff; color: #b91c1c; border-color: #fff; }
    .footer-hint { margin-top: 3vh; font-size: 1.8vh; opacity: .75; }

    .side { position: relative; background: rgba(2, 6, 23, .28); border-left: 1px solid rgba(255,255,255,.12); padding: 5vh 3.4vw; display: flex; flex-direction: column; min-width: 0; backdrop-filter: blur(4px); }
    .clock { font-size: 9vh; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
    .date { font-size: 2.3vh; opacity: .8; margin-top: 1vh; }
    .date::first-letter { text-transform: uppercase; }
    .agenda-title { margin: 4.5vh 0 1.6vh; font-size: 1.6vh; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .7; }
    .agenda { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 1.1vh; }
    .ag { display: grid; grid-template-columns: 11vh 1fr; gap: 1.8vh; align-items: center; padding: 1.5vh 1.8vh; border-radius: 1.6vh; background: rgba(255,255,255,.08); border: 1px solid transparent; }
    .ag .t { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 2vh; line-height: 1.25; }
    .ag .t small { display: block; opacity: .65; font-weight: 600; }
    .ag .w { min-width: 0; }
    .ag .w b { display: block; font-size: 2.1vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ag .w span { font-size: 1.7vh; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .ag.past { opacity: .4; }
    .ag.now { background: #fff; color: #0f172a; }
    .ag.free { background: transparent; border: 1.5px dashed rgba(255,255,255,.3); }
    .ag.free b { font-weight: 600; opacity: .85; }
    .empty-day { opacity: .7; font-size: 2.2vh; padding: 2vh 0; }
    .brand { margin-top: 2vh; font-size: 1.6vh; opacity: .55; display: flex; justify-content: space-between; }
    .offline { position: fixed; top: 1.4vh; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fbbf24; padding: .9vh 1.8vh; border-radius: 99px; font-size: 1.7vh; font-weight: 600; display: none; z-index: 10; }
    .fs-btn { position: fixed; right: 1.6vh; bottom: 1.6vh; width: 5vh; height: 5vh; border-radius: 1.2vh; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 2.4vh; cursor: pointer; opacity: .5; z-index: 10; }

    /* vista atrio: tutte le sale */
    .lobby { position: fixed; inset: 0; background: radial-gradient(1200px 700px at 0% 0%, #1e1b4b 0%, transparent 60%), #0b1220; padding: 4.5vh 4vw; display: flex; flex-direction: column; }
    .lobby-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 4vh; }
    .lobby-head h1 { margin: 0; font-size: 5vh; letter-spacing: -.02em; }
    .lobby-head p { margin: .6vh 0 0; opacity: .65; font-size: 2.1vh; }
    .lobby-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(30vh, 1fr)); gap: 2.2vh; align-content: stretch; }
    .lc { border-radius: 2.4vh; padding: 3vh; display: flex; flex-direction: column; position: relative; overflow: hidden; min-height: 0; }
    .lc h2 { margin: 0; font-size: 3.4vh; letter-spacing: -.01em; }
    .lc .lm { font-size: 1.8vh; opacity: .8; margin-top: .6vh; }
    .lc .lst { font-size: 5.4vh; font-weight: 900; text-transform: uppercase; letter-spacing: -.02em; margin-top: auto; }
    .lc .lsub { font-size: 2.1vh; font-weight: 600; opacity: .9; }
    .lc .lnext { margin-top: 2vh; padding-top: 1.6vh; border-top: 1px solid rgba(255,255,255,.25); font-size: 1.9vh; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .setup { position: fixed; inset: 0; display: grid; place-items: center; background: #0f172a; padding: 40px; text-align: center; }
    .setup div { max-width: 640px; }
    .setup h1 { font-size: 34px; }
    .setup p { opacity: .75; font-size: 18px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="offline" id="offline">Connessione assente — riprovo…</div>
  <div id="root"></div>
  <button class="fs-btn" id="fs" title="Schermo intero">⤢</button>
  <script src="display.js"></script>
</body>
</html>
